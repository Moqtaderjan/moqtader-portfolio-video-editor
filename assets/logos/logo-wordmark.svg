<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 130" width="360" height="130" role="img" aria-labelledby="wordmarkTitle">
  <title id="wordmarkTitle">Moqtader Hashimi — Video Editor</title>
  <defs>
    <style>
      .px { fill: #ece9e1; }
      .px-accent { fill: #5b9dff; }
    </style>
  </defs>

  <!-- Monogram: pixel grid, 8px unit -->
  <g transform="translate(4,4)">
    <!-- M -->
    <g class="px">
      <rect x="0" y="0" width="8" height="8"/>
      <rect x="0" y="8" width="8" height="8"/>
      <rect x="0" y="16" width="8" height="8"/>
      <rect x="0" y="24" width="8" height="8"/>
      <rect x="0" y="32" width="8" height="8"/>
      <rect x="8" y="8" width="8" height="8"/>
      <rect x="16" y="16" width="8" height="8"/>
      <rect x="24" y="8" width="8" height="8"/>
      <rect x="32" y="0" width="8" height="8"/>
      <rect x="32" y="8" width="8" height="8"/>
      <rect x="32" y="16" width="8" height="8"/>
      <rect x="32" y="24" width="8" height="8"/>
      <rect x="32" y="32" width="8" height="8"/>
    </g>
    <!-- Play icon (accent) -->
    <g class="px-accent">
      <rect x="48" y="4" width="8" height="8"/>
      <rect x="48" y="12" width="8" height="8"/>
      <rect x="48" y="20" width="8" height="8"/>
      <rect x="48" y="28" width="8" height="8"/>
      <rect x="56" y="12" width="8" height="8"/>
      <rect x="56" y="20" width="8" height="8"/>
      <rect x="64" y="16" width="8" height="8"/>
    </g>
    <!-- H -->
    <g class="px">
      <rect x="84" y="0" width="8" height="8"/>
      <rect x="84" y="8" width="8" height="8"/>
      <rect x="84" y="16" width="8" height="8"/>
      <rect x="84" y="24" width="8" height="8"/>
      <rect x="84" y="32" width="8" height="8"/>
      <rect x="92" y="16" width="8" height="8"/>
      <rect x="100" y="16" width="8" height="8"/>
      <rect x="108" y="0" width="8" height="8"/>
      <rect x="108" y="8" width="8" height="8"/>
      <rect x="108" y="16" width="8" height="8"/>
      <rect x="108" y="24" width="8" height="8"/>
      <rect x="108" y="32" width="8" height="8"/>
    </g>
  </g>

  <!-- Wordmark text -->
  <text x="4" y="80" font-family="Familjen Grotesk, Segoe UI, sans-serif" font-size="26" font-weight="600" fill="#ece9e1" letter-spacing="1">MOQTADER HASHIMI</text>
  <text x="4" y="102" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="12" letter-spacing="2" fill="#5b9dff">VIDEO EDITOR</text>
</svg>
